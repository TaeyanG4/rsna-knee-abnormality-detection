<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 664" width="960" height="664" font-family="system-ui, sans-serif" font-size="12" fill="#0b0b0b" role="img" aria-labelledby="title desc">
  <title id="title">Multi-agent research setup</title>
  <desc id="desc">Taeyang sets goals and rules for the coordinator B, a Claude Code session on Opus 5.5. B dispatches Codex astra 6 builder lanes (astra-b1 to b5, overflow astra-x1 to x6) and verifier lanes (astra-1 to 6), sends simple tasks to sol 6.1, consults Fable 5.1 and astra-6 with Opus as fallback, uses Opus subagents for the final pre-submission check, launches every job on Kaggle, the local RTX 4070 Ti SUPER and Vast.ai, and all agents share four coordination files.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="664" fill="#fcfcfb"/>

  <text x="24" y="30" font-size="14" font-weight="bold">Multi-agent research setup</text>
  <text x="24" y="48" fill="#52514e">One coordinator, separate builder and verifier lanes, independent consultants, four shared files and three compute pools.</text>

  <!-- row 1 -->
  <rect x="24" y="60" width="250" height="112" rx="6" fill="#ffffff" stroke="#c9c7c1" stroke-width="1.2"/>
  <text x="36" y="80" font-size="13" font-weight="bold">Skills and tools</text>
  <text x="36" y="98">research-orchestrator-skill</text>
  <text x="36" y="114">numerical-parity-skill</text>
  <text x="36" y="130">Kaggle skill and Kaggle CLI</text>
  <text x="36" y="146">built-in browser, Claude in Chrome</text>
  <text x="36" y="162">dataviz skill</text>

  <rect x="360" y="60" width="240" height="60" rx="6" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="480" y="84" text-anchor="middle" font-size="13" font-weight="bold">Taeyang</text>
  <text x="480" y="104" text-anchor="middle">goals, standing rules, approvals</text>
  <path d="M480,120 L480,198" stroke="#52514e" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

  <rect x="686" y="60" width="250" height="112" rx="6" fill="#f3f2ef" stroke="#52514e" stroke-width="1.3"/>
  <text x="698" y="80" font-size="13" font-weight="bold">Consult pair (same brief)</text>
  <text x="698" y="98">Fable 5.1 (Claude) and astra-6</text>
  <text x="698" y="114">fallback: Opus 5.5</text>
  <text x="698" y="130">both answers and the decision</text>
  <text x="698" y="146">recorded; the rule written down</text>
  <text x="698" y="162">before the result</text>
  <path d="M602,214 L640,214 L640,150 L684,150" stroke="#52514e" stroke-width="1.3" fill="none" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- row 2 -->
  <rect x="24" y="200" width="250" height="112" rx="6" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.6"/>
  <text x="36" y="220" font-size="13" font-weight="bold">Builder lanes (astra 6)</text>
  <text x="36" y="240">astra-b1 release, b2 data and</text>
  <text x="36" y="256">training, b3 scouting, b4/b5 pool</text>
  <text x="36" y="272">overflow lanes astra-x1..x6</text>
  <text x="36" y="294" fill="#52514e">one candidate per build</text>

  <rect x="360" y="200" width="240" height="112" rx="6" fill="#f3f2ef" stroke="#0b0b0b" stroke-width="2"/>
  <text x="372" y="220" font-size="13" font-weight="bold">B: Claude Code (Opus 5.5)</text>
  <text x="372" y="240">coordinator: plans the queue,</text>
  <text x="372" y="256">launches GPU jobs and Kaggle</text>
  <text x="372" y="272">pushes, makes the submissions</text>
  <text x="372" y="294" fill="#52514e">only contact with Taeyang</text>

  <rect x="686" y="200" width="250" height="112" rx="6" fill="#e6f6ef" stroke="#1baf7a" stroke-width="1.6"/>
  <text x="698" y="220" font-size="13" font-weight="bold">Verifier lanes (astra 6)</text>
  <text x="698" y="240">astra-1..6: independent strict</text>
  <text x="698" y="256">review before any GPU or Kaggle</text>
  <text x="698" y="272">run; a FAIL is binding and goes</text>
  <text x="698" y="288">back to the builder</text>

  <g stroke="#52514e" stroke-width="1.3" fill="none" marker-end="url(#arr)">
    <path d="M360,240 L276,240"/>
    <path d="M274,284 L358,284"/>
    <path d="M600,240 L684,240"/>
    <path d="M686,284 L602,284"/>
  </g>
  <g fill="#52514e" text-anchor="middle">
    <text x="317" y="233" data-free="1">dispatch.sh</text>
    <text x="317" y="277" data-free="1">build + tests</text>
    <text x="643" y="233" data-free="1">review</text>
    <text x="643" y="277" data-free="1">PASS / FAIL</text>
  </g>
  <text x="317" y="300" text-anchor="middle" fill="#52514e" data-free="1">via codex-lb</text>

  <!-- row 3 -->
  <rect x="24" y="344" width="250" height="58" rx="6" fill="#ffffff" stroke="#c9c7c1" stroke-width="1.2"/>
  <text x="36" y="366" font-size="13" font-weight="bold">sol 6.1 (Codex)</text>
  <text x="36" y="386">simple tasks only (SIMPLE=1)</text>

  <rect x="686" y="344" width="250" height="80" rx="6" fill="#ffffff" stroke="#c9c7c1" stroke-width="1.2"/>
  <text x="698" y="364" font-size="13" font-weight="bold">Opus 5.5 subagents (Claude)</text>
  <text x="698" y="383">7-item final pre-submission check;</text>
  <text x="698" y="399">stand-in builds and reviews</text>
  <text x="698" y="415">when Codex was unavailable</text>

  <g stroke="#52514e" stroke-width="1.3" fill="none" marker-end="url(#arr)">
    <path d="M380,312 L278,370"/>
    <path d="M580,312 L684,378"/>
    <path d="M480,312 L480,432"/>
  </g>
  <text x="490" y="372" fill="#52514e" data-free="1">launches every GPU job</text>
  <text x="490" y="388" fill="#52514e" data-free="1">and Kaggle push</text>

  <!-- row 4 resources -->
  <path d="M169,432 L791,432" stroke="#52514e" stroke-width="1.3" fill="none"/>
  <g stroke="#52514e" stroke-width="1.3" fill="none" marker-end="url(#arr)">
    <path d="M169,432 L169,442"/>
    <path d="M480,432 L480,442"/>
    <path d="M791,432 L791,442"/>
  </g>
  <rect x="24" y="444" width="290" height="74" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="1.3"/>
  <text x="36" y="464" font-size="13" font-weight="bold">Kaggle (T4 x 2 sessions)</text>
  <text x="36" y="484">submissions and qualification runs</text>
  <text x="36" y="500">(visible run, N32)</text>

  <rect x="335" y="444" width="290" height="74" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="1.3"/>
  <text x="347" y="464" font-size="13" font-weight="bold">Local RTX 4070 Ti SUPER</text>
  <text x="347" y="484">training, holdout tests and pilots</text>

  <rect x="646" y="444" width="290" height="74" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="1.3"/>
  <text x="658" y="464" font-size="13" font-weight="bold">Vast.ai (rented cloud GPUs)</text>
  <text x="658" y="484">an RTX 3090 earlier, an RTX 4090</text>
  <text x="658" y="500">for part of the K1 training</text>

  <!-- row 5 files -->
  <text x="24" y="550" font-size="13" font-weight="bold">Four coordination files in notes/, read and written by every agent</text>
  <rect x="24" y="560" width="216" height="62" rx="6" fill="#ffffff" stroke="#c9c7c1" stroke-width="1.2"/>
  <text x="36" y="580" font-size="13" font-weight="bold" font-family="ui-monospace, monospace">agents.md</text>
  <text x="36" y="598">rules and standing</text>
  <text x="36" y="614">instructions, dated</text>
  <rect x="256" y="560" width="216" height="62" rx="6" fill="#ffffff" stroke="#c9c7c1" stroke-width="1.2"/>
  <text x="268" y="580" font-size="13" font-weight="bold" font-family="ui-monospace, monospace">plan.md</text>
  <text x="268" y="598">one scored queue and the</text>
  <text x="268" y="614">final-slot schedule</text>
  <rect x="488" y="560" width="216" height="62" rx="6" fill="#ffffff" stroke="#c9c7c1" stroke-width="1.2"/>
  <text x="500" y="580" font-size="13" font-weight="bold" font-family="ui-monospace, monospace">discoveries.md</text>
  <text x="500" y="598">about 390 findings, each</text>
  <text x="500" y="614">cross-checked once</text>
  <rect x="720" y="560" width="216" height="62" rx="6" fill="#ffffff" stroke="#c9c7c1" stroke-width="1.2"/>
  <text x="732" y="580" font-size="13" font-weight="bold" font-family="ui-monospace, monospace">handoff.md</text>
  <text x="732" y="598">event log: who did what,</text>
  <text x="732" y="614">when, with which artifacts</text>

  <text x="24" y="648" fill="#52514e">Builder and reviewer were always different agents; every long or important task was reviewed before and after (section 14.4).</text>
</svg>
