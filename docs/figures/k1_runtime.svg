<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 656" width="960" height="656" font-family="system-ui, sans-serif" font-size="12" fill="#0b0b0b" role="img" aria-labelledby="title desc">
  <title id="title">K1 runtime v10</title>
  <desc id="desc">K1 runtime v10: load K1 (limit 1500 s), then for each hidden study capture the R6-rendered windows (deadline 900 s) and classify (call limit 300 s); a failed study takes the parent's rank. At the end, more than 5 % failed studies, a load failure or timeout, or the 8.8 h guard writes the parent CSV and raises (fail-loud); otherwise the scored run proves K1 ran on at least 95 % of hidden studies. Below, hidden runtimes against the 8.3 h gate, the 8.8 h guard and the 9 h limit: on Oct 22 U, U4 and F4 ended without a score at about 9.2 h.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="656" fill="#fcfcfb"/>

  <text x="24" y="30" font-size="14" font-weight="bold">K1 runtime v10: per-study fallback, fail-loud and the 8.8 h guard</text>
  <text x="24" y="48" fill="#52514e">Runtime v10 serves K1 in final F (P25F); final X uses the older runtime v5. Limits and times from sections 7.6 and 10.</text>

  <!-- load -->
  <rect x="24" y="86" width="168" height="80" rx="6" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/>
  <text x="36" y="106" font-size="13" font-weight="bold">Load K1</text>
  <text x="36" y="124">three checkpoints, FP16</text>
  <text x="36" y="140">load limit 1500 s</text>
  <text x="36" y="156" fill="#52514e">a failure is systemic</text>
  <path d="M192,126 L224,126" stroke="#52514e" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

  <!-- per-study container -->
  <rect x="214" y="70" width="428" height="186" rx="8" fill="none" stroke="#c9c7c1" stroke-width="1.2" stroke-dasharray="6 4" data-nocheck="1"/>
  <text x="226" y="88" font-weight="bold" fill="#52514e" data-free="1">FOR EACH HIDDEN STUDY</text>

  <rect x="226" y="98" width="196" height="78" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="1.3"/>
  <text x="238" y="118" font-size="13" font-weight="bold">Capture windows</text>
  <text x="238" y="136">reuses the windows R6</text>
  <text x="238" y="152">already rendered</text>
  <text x="238" y="168">deadline 900 s (was 120 s)</text>
  <path d="M422,137 L432,137" stroke="#52514e" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

  <rect x="434" y="98" width="196" height="78" rx="6" fill="#ffffff" stroke="#52514e" stroke-width="1.3"/>
  <text x="446" y="118" font-size="13" font-weight="bold">Classify</text>
  <text x="446" y="136">all K1 checkpoints</text>
  <text x="446" y="152">call limit 300 s</text>
  <text x="446" y="168" fill="#52514e">per-target rank mean</text>

  <g stroke="#52514e" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)">
    <path d="M324,176 L324,194"/>
    <path d="M532,176 L532,194"/>
  </g>
  <text x="330" y="190" fill="#52514e" data-free="1">fail</text>
  <text x="538" y="190" fill="#52514e" data-free="1">fail</text>

  <rect x="226" y="196" width="404" height="50" rx="6" fill="#f3f2ef" stroke="#52514e" stroke-width="1.3"/>
  <text x="238" y="216" font-size="13" font-weight="bold">Per-study fallback</text>
  <text x="238" y="234">a failed study takes the parent's rank in the K1 slot</text>

  <g stroke="#52514e" stroke-width="1.3" fill="none">
    <path d="M630,137 L652,137 L652,118 L666,118" marker-end="url(#arr)"/>
    <path d="M630,221 L652,221 L652,137"/>
  </g>

  <!-- end-of-run -->
  <rect x="668" y="70" width="268" height="96" rx="6" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.6"/>
  <text x="680" y="90" font-size="13" font-weight="bold">End-of-run check</text>
  <text x="680" y="110">more than 5 % of studies failed,</text>
  <text x="680" y="126">a load failure or timeout, or the</text>
  <text x="680" y="142">guard fired?</text>
  <path d="M802,166 L802,180" stroke="#52514e" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  <path d="M936,100 L948,100 L948,304 L938,304" stroke="#52514e" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

  <rect x="668" y="182" width="268" height="72" rx="6" fill="#fbeaea" stroke="#d03b3b" stroke-width="1.6"/>
  <text x="680" y="202" font-size="13" font-weight="bold">yes: fail-loud</text>
  <text x="680" y="220">writes the parent CSV, then raises:</text>
  <text x="680" y="236">Kaggle shows an error, not a weaker score</text>

  <rect x="668" y="268" width="268" height="72" rx="6" fill="#e6f6ef" stroke="#1baf7a" stroke-width="1.6"/>
  <text x="680" y="288" font-size="13" font-weight="bold">no: scored run</text>
  <text x="680" y="306">blend CSV written; proves K1 ran on</text>
  <text x="680" y="322">at least 95 % of hidden studies</text>

  <!-- version history -->
  <text x="24" y="276" font-weight="bold" fill="#52514e">HOW THE RUNTIME GOT HERE</text>
  <rect x="24" y="284" width="196" height="84" rx="6" fill="#f3f2ef" stroke="#c9c7c1" stroke-width="1.2"/>
  <text x="36" y="304" font-size="13" font-weight="bold">v1-v7: fail-safe</text>
  <text x="36" y="322">one K1 failure dropped all</text>
  <text x="36" y="338">of K1 and silently sent</text>
  <text x="36" y="354">the parent CSV</text>

  <rect x="234" y="284" width="196" height="84" rx="6" fill="#f3f2ef" stroke="#c9c7c1" stroke-width="1.2"/>
  <text x="246" y="304" font-size="13" font-weight="bold">v8-v9: fail-loud</text>
  <text x="246" y="322">per-study fallback; systemic</text>
  <text x="246" y="338">failure raises at the end;</text>
  <text x="246" y="354">v9 fixed a late-finish revert</text>

  <rect x="444" y="284" width="196" height="84" rx="6" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/>
  <text x="456" y="304" font-size="13" font-weight="bold">v10: longer timeouts</text>
  <text x="456" y="322">capture 120 s → 900 s and</text>
  <text x="456" y="338">call limit 300 s after 4 of 32</text>
  <text x="456" y="354">heavy studies took 143-151 s</text>
  <g stroke="#52514e" stroke-width="1.3" fill="none" marker-end="url(#arr)">
    <path d="M220,326 L232,326"/>
    <path d="M430,326 L442,326"/>
  </g>

  <!-- timeline: x(t) = 200 + (t - 5.5) * 180 -->
  <text x="24" y="398" font-size="13" font-weight="bold">Hidden runtime per submission (submit to COMPLETE, queue included; upper bounds) against the limits</text>

  <g stroke-width="1.5" fill="none">
    <path d="M704,404 L704,560" stroke="#1baf7a" stroke-dasharray="5 3"/>
    <path d="M794,404 L794,560" stroke="#52514e" stroke-dasharray="5 3"/>
    <path d="M830,404 L830,560" stroke="#d03b3b"/>
  </g>
  <text x="700" y="414" text-anchor="end" fill="#52514e">8.3 h gate</text>
  <text x="790" y="414" text-anchor="end" fill="#52514e">8.8 h K1 guard</text>
  <text x="834" y="414" font-weight="bold" fill="#d03b3b">9 h Kaggle limit</text>

  <g font-weight="bold">
    <text x="24" y="433">P25F (final F) ≤ 6.87 h</text>
    <text x="24" y="457">x3-v2 (final X) 7.90-7.98 h</text>
    <text x="24" y="481">P4 (Oct 22) ≤ 8.24 h</text>
    <text x="24" y="505" fill="#d03b3b">U (Oct 22) ≤ 9.18 h</text>
    <text x="24" y="529" fill="#d03b3b">U4 (Oct 22) ≤ 9.18 h</text>
    <text x="24" y="553" fill="#d03b3b">F4 (Oct 22) ≤ 9.21 h</text>
  </g>
  <g>
    <rect x="200" y="422" width="246.6" height="14" rx="2" fill="#8a8984" data-nocheck="1"/>
    <rect x="200" y="446" width="432" height="14" rx="2" fill="#8a8984" data-nocheck="1"/>
    <rect x="632" y="446" width="14.4" height="14" fill="#c9c7c1" data-nocheck="1"/>
    <rect x="200" y="470" width="493.2" height="14" rx="2" fill="#8a8984" data-nocheck="1"/>
    <rect x="200" y="494" width="662.4" height="14" rx="2" fill="#d03b3b" data-nocheck="1"/>
    <rect x="200" y="518" width="662.4" height="14" rx="2" fill="#d03b3b" data-nocheck="1"/>
    <rect x="200" y="542" width="667.8" height="14" rx="2" fill="#d03b3b" data-nocheck="1"/>
    <path d="M578,495 L584,501 L578,507 L572,501 Z" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.2"/>
    <path d="M659,519 L665,525 L659,531 L653,525 Z" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.2"/>
  </g>
  <text x="876" y="505" font-weight="bold" fill="#d03b3b" data-free="1">no score</text>
  <text x="876" y="529" font-weight="bold" fill="#d03b3b" data-free="1">no score</text>
  <text x="876" y="553" font-weight="bold" fill="#d03b3b" data-free="1">no score</text>

  <!-- axis -->
  <path d="M200,564 L920,564" stroke="#52514e" stroke-width="1.2" fill="none"/>
  <g stroke="#52514e" stroke-width="1.2">
    <path d="M200,564 L200,569"/><path d="M290,564 L290,569"/><path d="M470,564 L470,569"/><path d="M650,564 L650,569"/><path d="M830,564 L830,569"/>
  </g>
  <g fill="#52514e" text-anchor="middle">
    <text x="200" y="582">5.5 h</text>
    <text x="290" y="582">6 h</text>
    <text x="470" y="582">7 h</text>
    <text x="650" y="582">8 h</text>
    <text x="830" y="582">9 h</text>
  </g>

  <g fill="#52514e">
    <text x="24" y="606">Oct 22: U, U4 and F4 ended without a score at about 9.2 h; P4, with the same compute as F4, had finished at ≤ 8.24 h that day.</text>
    <text x="24" y="624">The guard is measured from kernel start and stops only the K1 branch: it did not bound the parent phases or queue time (D-B-282).</text>
    <text x="40" y="642">= estimated median before submitting: about 7.6 h (U) and 8.05 h (U4). Axis starts at 5.5 h.</text>
  </g>
  <path d="M30,632 L36,638 L30,644 L24,638 Z" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.2"/>
  <g>
  </g>
</svg>
